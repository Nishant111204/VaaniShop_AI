server:
  port: ${SERVER_PORT:8080}
  # Set to "native" or "framework" when running behind a trusted reverse proxy,
  # so rate limits see the real client IP instead of the proxy's.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,application/json,application/xml,image/svg+xml,application/manifest+json
    min-response-size: 1024

spring:
  application:
    name: vaani-shop-ai
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vaanishopai}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  site:
    # Public address of the site, used in link previews and the sitemap.
    public-url: ${APP_PUBLIC_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5847}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  groq:
    api-key: ${GROQ_API_KEY:}
    chat-model: ${GROQ_CHAT_MODEL:openai/gpt-oss-120b}
    reasoning-effort: ${GROQ_REASONING_EFFORT:low}
    stt-model: ${GROQ_STT_MODEL:whisper-large-v3}
    stt-language: ${GROQ_STT_LANGUAGE:}
    timeout-ms: ${GROQ_TIMEOUT_MS:30000}
  rate-limit:
    speech-per-minute: ${RATE_LIMIT_SPEECH_PER_MINUTE:10}
    ai-per-minute: ${RATE_LIMIT_AI_PER_MINUTE:8}

logging:
  level:
    root: INFO
    com.vaanishopai: DEBUG
