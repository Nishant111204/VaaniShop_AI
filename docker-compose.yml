# Self-hosted VaaniShop: the app plus its own Postgres.
#   docker compose up -d --build
# Reads GROQ_API_KEY, JWT_SECRET, POSTGRES_PASSWORD and the optional settings from .env.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaanishopai
      POSTGRES_USER: vaanishop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaanishop -d vaanishopai"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/vaanishopai
      DATABASE_USERNAME: vaanishop
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:8080}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-low}

volumes:
  db-data:
